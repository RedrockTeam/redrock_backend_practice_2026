name: grade-go-exercises

# 每次 push、每次 Pull Request（含 fork 来的 PR）都把仓库里所有课次的
# 所有测试目录完整跑一遍，不做任何按课次的裁剪。
#
# 这个 workflow 运行在「不可信」上下文里：fork 发来的 PR 拿不到本仓库的
# secrets，token 也是只读的。所以这里只负责跑测试、产出结果，
# 把 result.json 上报到成绩网站交给 report-result.yml（workflow_run）完成。
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 不取消进行中的运行：每一次提交都要拿到一份完整的评分结果。
  group: grade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run every Go test package
        id: grade
        continue-on-error: true
        env:
          # 默认 '.' 表示整个仓库全跑；仓库变量 TEST_ROOT 只在需要临时缩小范围时设置。
          TEST_ROOT: ${{ vars.TEST_ROOT || '.' }}
        run: |
          python3 .github/scripts/run_go_tests.py \
            --root "$TEST_ROOT" \
            --result result.json \
            --summary score.md \
            --raw-dir test-results

      - name: Check for data races (feedback only)
        continue-on-error: true
        run: go test -race -count=1 ./...

      # PR 号无法从 workflow_run 事件里可靠取到（fork PR 的 pull_requests 是空的），
      # 所以在这里单独落一个文件，由 report-result.yml 去核验它。
      - name: Record the pull request number
        if: github.event_name == 'pull_request'
        run: echo '${{ github.event.pull_request.number }}' > pull-request-number.txt

      - name: Upload result bundle
        uses: actions/upload-artifact@v4
        with:
          name: go-test-result
          path: |
            result.json
            score.md
            test-results/
            pull-request-number.txt
          if-no-files-found: error
          retention-days: 14

      - name: Fail the check when tests failed
        if: steps.grade.outputs.status != 'pass'
        run: |
          echo "::error::有测试未通过，积分 ${{ steps.grade.outputs.score || 0 }}/100。详情见 Step Summary 与 go-test-result artifact。"
          exit 1
