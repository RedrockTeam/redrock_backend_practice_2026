name: report-result

# 把 grade-go-exercises 产出的 result.json 发送到课程成绩网站。
#
# 为什么要单独一个 workflow：
# fork 发来的 Pull Request 在 pull_request 事件里拿不到 secrets，
# 所以上报动作不能写在 grade.yml 里。workflow_run 事件运行在**基仓库**的
# 上下文中，可以读到 secrets，而且始终使用默认分支上的这份 workflow 文件，
# 学生改不了它——这正是处理不可信 PR 的标准做法。
#
# 需要配置：
#   仓库变量 RESULT_UPLOAD_ENDPOINT   成绩网站的收件路由，例如
#                                     https://grade.example.edu/api/v1/results
#   仓库变量 RESULT_UPLOAD_METHOD     可选，默认 POST
#   仓库 secret RESULT_UPLOAD_TOKEN   可选，作为 Bearer Token 发送
# 未配置 endpoint 时整个 workflow 直接跳过，不影响评分。
on:
  workflow_run:
    workflows: [grade-go-exercises]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.RESULT_UPLOAD_ENDPOINT != ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the result bundle
        uses: actions/download-artifact@v4
        with:
          name: go-test-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: bundle

      # result.json 来自不可信的 fork 运行，学生可以改里面的任何字段。
      # 这一步用 workflow_run 事件里可信的值覆盖掉身份信息，
      # 并通过 API 核验 PR 号确实指向同一个 commit。
      - name: Verify and stamp trusted identity
        id: stamp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRUSTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRUSTED_ACTOR: ${{ github.event.workflow_run.actor.login }}
          TRUSTED_EVENT: ${{ github.event.workflow_run.event }}
          TRUSTED_RUN_ID: ${{ github.event.workflow_run.id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRUSTED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          TRUSTED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 .github/scripts/stamp_result.py --bundle bundle --output result.json

      - name: Send result to the grading website
        env:
          ENDPOINT: ${{ vars.RESULT_UPLOAD_ENDPOINT }}
          METHOD: ${{ vars.RESULT_UPLOAD_METHOD || 'POST' }}
          TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          RESULT_ID: ${{ steps.stamp.outputs.result_id }}
        run: |
          set -euo pipefail
          headers=(
            --header "Content-Type: application/json"
            --header "Accept: application/json"
            --header "Idempotency-Key: ${RESULT_ID}"
          )
          if [[ -n "${TOKEN}" ]]; then
            headers+=(--header "Authorization: Bearer ${TOKEN}")
          fi
          curl \
            --fail-with-body \
            --silent --show-error \
            --retry 3 --retry-connrefused \
            --connect-timeout 10 \
            --max-time 30 \
            --request "${METHOD}" \
            "${headers[@]}" \
            --data-binary @result.json \
            "${ENDPOINT}"
          echo "已上报 result_id=${RESULT_ID}"

      - name: Upload the stamped payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reported-result
          path: result.json
          if-no-files-found: warn
          retention-days: 14
